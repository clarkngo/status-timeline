      events.forEach((ev, idx) => {
        const s = STATUS_MAP[ev.status];
        const isLeft = cardIndex % 2 === 0;
        cardIndex++;

        const badgesHtml = ev.badges.map(b =>
          `<span class="inline-flex items-center text-[10px] sm:text-xs font-semibold px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full ${s.badge}">${b}</span>`
        ).join('');

        const item = document.createElement('div');
        item.className = `timeline-item relative ${isLeft ? 'card-left' : 'card-right'} pb-8 pl-7`;
        item.dataset.categories = ev.categories.join(' ');
        item.style.animationDelay = `${idx * 50}ms`;
        if (activeFilter !== 'all' && !ev.categories.includes(activeFilter)) {
          item.classList.add('hidden-by-filter');
        }

        // Dot color
        const dotColorMap = {
          success: '#10b981', info: '#38bdf8', warning: '#f59e0b',
          critical: '#f43f5e', upcoming: '#a78bfa',
        };
        const dotColor = dotColorMap[ev.status];

        item.innerHTML = `
          <!-- Spine dot -->
          <div class="timeline-dot ${s.dot}" style="color: ${dotColor}; background: ${dotColor};"></div>

          <!-- Connector line (desktop only) -->
          <div class="relative ${isLeft ? 'connector-left' : 'connector-right'}">
            <div class="timeline-card relative bg-white rounded-2xl shadow-sm border border-slate-100 border-l-4 ${s.border} overflow-hidden">

              <!-- Card header -->
              <div class="${s.header} px-4 sm:px-5 pt-4 sm:pt-5 pb-3">
                <div class="flex items-start justify-between gap-3 mb-2">
                  <time class="text-[10px] sm:text-xs font-semibold tracking-widest uppercase ${s.dot} opacity-80">${ev.date}</time>
                  <span class="${s.dot}">${s.icon}</span>
                </div>
                <h2 class="font-bold text-slate-800 text-sm sm:text-base leading-snug">${ev.title}</h2>
              </div>

              <!-- Card body -->
              <div class="px-4 sm:px-5 py-3 sm:py-4">
                <p class="text-slate-500 text-xs sm:text-sm leading-relaxed mb-3 line-clamp-2 sm:line-clamp-none">${ev.note}</p>
                <div class="flex flex-wrap gap-1.5">${badgesHtml}</div>
              </div>

            </div>
          </div>
        `;

        list.appendChild(item);
      });
    }

    // Filter
    document.getElementById('filter-bar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-chip');
      if (!btn) return;
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderTimeline();
    });

    // Sort
    const sortAscBtn  = document.getElementById('sort-asc');
    const sortDescBtn = document.getElementById('sort-desc');
    function setSortUI(asc) {
      sortAsc = asc;
      const on  = 'bg-white shadow text-slate-700';
      const off = 'text-slate-500';
      sortAscBtn.className  = `sort-btn text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap ${asc ? on : off}`;
      sortDescBtn.className = `sort-btn text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap ${asc ? off : on}`;
      renderTimeline();
    }
    sortAscBtn.addEventListener('click',  () => setSortUI(true));
    sortDescBtn.addEventListener('click', () => setSortUI(false));

    renderTimeline();
  </script>

</body>
</html>
